
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Fresh Basket Grocery Store</title>

<style>
* {
    box-sizing: border-box;
    margin: 0;
    padding: 0;
}

body {
    font-family: Arial, sans-serif;
    background: #f5fff3;
    color: #333;
}

header {
    background: #269b55;
    color: white;
    padding: 22px;
    text-align: center;
}

header h1 {
    font-size: 30px;
}

header p {
    margin-top: 8px;
}

nav {
    background: #187d42;
    padding: 13px;
    text-align: center;
}

nav a {
    color: white;
    text-decoration: none;
    margin: 0 15px;
    font-weight: bold;
}

.container {
    max-width: 1100px;
    margin: auto;
    padding: 20px;
}

.search-box {
    width: 100%;
    padding: 13px;
    border: 2px solid #269b55;
    border-radius: 10px;
    font-size: 16px;
    margin-bottom: 20px;
}

h2 {
    margin: 20px 0;
    color: #218b49;
}

.products {
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(180px, 1fr));
    gap: 20px;
}

.product {
    background: white;
    padding: 18px;
    text-align: center;
    border-radius: 15px;
    box-shadow: 0 3px 10px #00000012;
}

.product .emoji {
    font-size: 65px;
    margin-bottom: 10px;
}

.product h3 {
    margin-bottom: 8px;
}

.price {
    color: #269b55;
    font-weight: bold;
    margin: 10px;
    font-size: 18px;
}

button {
    background: #269b55;
    color: white;
    border: none;
    padding: 10px 15px;
    border-radius: 7px;
    cursor: pointer;
    font-size: 14px;
}

button:hover {
    background: #187d42;
}

.cart {
    margin-top: 35px;
    background: white;
    padding: 20px;
    border-radius: 15px;
    box-shadow: 0 3px 10px #00000012;
}

.cart-item {
    display: flex;
    justify-content: space-between;
    align-items: center;
    gap: 10px;
    padding: 12px 0;
    border-bottom: 1px solid #ddd;
}

.cart-controls {
    display: flex;
    align-items: center;
    gap: 8px;
}

.cart-controls button {
    padding: 5px 10px;
}

.remove {
    background: #e34e4e;
}

.total {
    font-size: 22px;
    font-weight: bold;
    text-align: right;
    margin-top: 20px;
    color: #218b49;
}

.checkout {
    width: 100%;
    margin-top: 20px;
    padding: 14px;
    font-size: 17px;
}

.empty {
    color: gray;
    margin-top: 15px;
}

footer {
    background: #187d42;
    color: white;
    text-align: center;
    padding: 20px;
    margin-top: 35px;
}

@media(max-width: 500px) {
    header h1 {
        font-size: 24px;
    }

    nav a {
        margin: 0 7px;
        font-size: 13px;
    }

    .cart-item {
        flex-wrap: wrap;
    }
}
</style>
</head>

<body>

<header>
    <h1>🥬 Fresh Basket</h1>
    <p>Your Daily Fresh Grocery Store 🛒</p>
</header>

<nav>
    <a href="#home">Home</a>
    <a href="#products">Products</a>
    <a href="#cart">My Cart 🛒</a>
</nav>

<div class="container" id="home">

    <h2>Welcome to Fresh Basket!</h2>
    <p>Buy fresh fruits, vegetables and groceries at great prices.</p>

    <br>

    <input
        type="text"
        class="search-box"
        id="search"
        placeholder="🔍 Search for groceries..."
        oninput="searchProducts()"
    >

    <h2 id="products">🛍️ Our Products</h2>

    <div class="products" id="productList"></div>

    <div class="cart" id="cart">

        <h2>🛒 My Shopping Cart</h2>

        <div id="cartItems">
            <p class="empty">Your cart is empty!</p>
        </div>

        <div class="total">
            Total: ₹<span id="total">0</span>
        </div>

        <button class="checkout" onclick="checkout()">
            Proceed to Checkout 💳
        </button>

    </div>

</div>

<footer>
    <p>🥑 Fresh Basket Grocery Store</p>
    <p>Freshness Delivered With Love ❤️</p>
</footer>

<script>

// Grocery products
const products = [
    {id: 1, name: "Apple", price: 120, emoji: "🍎"},
    {id: 2, name: "Banana", price: 50, emoji: "🍌"},
    {id: 3, name: "Orange", price: 80, emoji: "🍊"},
    {id: 4, name: "Mango", price: 100, emoji: "🥭"},
    {id: 5, name: "Carrot", price: 40, emoji: "🥕"},
    {id: 6, name: "Tomato", price: 30, emoji: "🍅"},
    {id: 7, name: "Broccoli", price: 60, emoji: "🥦"},
    {id: 8, name: "Potato", price: 35, emoji: "🥔"},
    {id: 9, name: "Milk", price: 60, emoji: "🥛"},
    {id: 10, name: "Bread", price: 45, emoji: "🍞"},
    {id: 11, name: "Eggs", price: 90, emoji: "🥚"},
    {id: 12, name: "Cheese", price: 150, emoji: "🧀"}
];

// Shopping cart
let cart = [];

// Display products
function displayProducts(list = products) {

    const productList = document.getElementById("productList");

    productList.innerHTML = "";

    if (list.length === 0) {
        productList.innerHTML = "<p>No products found.</p>";
        return;
    }

    list.forEach(product => {

        productList.innerHTML += `
            <div class="product">

                <div class="emoji">${product.emoji}</div>

                <h3>${product.name}</h3>

                <p class="price">₹${product.price}</p>

                <button onclick="addToCart(${product.id})">
                    Add to Cart 🛒
                </button>

            </div>
        `;

    });
}

// Search products
function searchProducts() {

    const value = document
        .getElementById("search")
        .value.toLowerCase();

    const filtered = products.filter(product =>
        product.name.toLowerCase().includes(value)
    );

    displayProducts(filtered);
}

// Add product to cart
function addToCart(id) {

    const product = products.find(p => p.id === id);

    const existing = cart.find(item => item.id === id);

    if (existing) {
        existing.quantity++;
    } else {
        cart.push({...product, quantity: 1});
    }

    displayCart();

}

// Increase quantity
function increase(id) {

    const item = cart.find(p => p.id === id);

    if (item) {
        item.quantity++;
    }

    displayCart();
}

// Decrease quantity
function decrease(id) {

    const item = cart.find(p => p.id === id);

    if (item) {
        item.quantity--;

        if (item.quantity <= 0) {
            cart = cart.filter(p => p.id !== id);
        }
    }

    displayCart();
}

// Remove product
function removeItem(id) {

    cart = cart.filter(p => p.id !== id);

    displayCart();
}

// Display cart
function displayCart() {

    const cartItems = document.getElementById("cartItems");

    let total = 0;

    if (cart.length === 0) {

        cartItems.innerHTML =
            '<p class="empty">Your cart is empty!</p>';

    } else {

        cartItems.innerHTML = "";

        cart.forEach(item => {

            total += item.price * item.quantity;

            cartItems.innerHTML += `

                <div class="cart-item">

                    <div>
                        <strong>${item.emoji} ${item.name}</strong>
                        <br>
                        ₹${item.price} each
                    </div>

                    <div class="cart-controls">

                        <button onclick="decrease(${item.id})">−</button>

                        <span>${item.quantity}</span>

                        <button onclick="increase(${item.id})">+</button>

                        <button class="remove"
                            onclick="removeItem(${item.id})">
                            Remove
                        </button>

                    </div>

                    <strong>₹${item.price * item.quantity}</strong>

                </div>

            `;

        });

    }

    document.getElementById("total").textContent = total;

}

// Checkout
function checkout() {

    if (cart.length === 0) {

        alert("Please add some groceries to your cart!");

        return;
    }

    let total = cart.reduce(
        (sum, item) => sum + item.price * item.quantity,
        0
    );

    alert(
        "🎉 Order placed successfully!\n\n" +
        "Your total bill is ₹" + total +
        "\n\nThank you for shopping with Fresh Basket!"
    );

    cart = [];

    displayCart();

}

// Initial display
displayProducts();
displayCart();

</script>

</body>
</html>
