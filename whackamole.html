
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Whack a Mole - Mole Garden</title>

<style>
* {
    box-sizing: border-box;
}

body {
    margin: 0;
    font-family: "Comic Sans MS", Arial, sans-serif;
    background: linear-gradient(135deg, #ffd6e7, #d8c5ff);
    text-align: center;
    color: #784b72;
    min-height: 100vh;
    padding: 20px;
}

h1 {
    font-size: 36px;
    color: #e85d9e;
    text-shadow: 2px 2px white;
}

.subtitle {
    font-size: 17px;
    margin-bottom: 20px;
}

.game {
    background: #fff8fc;
    max-width: 450px;
    margin: auto;
    padding: 22px;
    border-radius: 25px;
    box-shadow: 0 8px 20px #a77caa55;
}

.stats {
    display: flex;
    justify-content: space-around;
    gap: 8px;
    margin-bottom: 20px;
}

.stat {
    background: #ffe3f0;
    padding: 12px;
    border-radius: 15px;
    flex: 1;
    font-size: 16px;
}

.stat span {
    display: block;
    font-size: 25px;
    font-weight: bold;
    color: #df5794;
}

.board {
    display: grid;
    grid-template-columns: repeat(3, 1fr);
    gap: 12px;
    background: #c8efa9;
    padding: 15px;
    border-radius: 20px;
}

.hole {
    height: 100px;
    background: #8b5a42;
    border: 5px solid #a96d50;
    border-radius: 50%;
    cursor: pointer;
    font-size: 48px;
    display: flex;
    justify-content: center;
    align-items: center;
    transition: transform 0.1s;
    user-select: none;
    touch-action: manipulation;
}

.hole:active {
    transform: scale(0.3);
}

.mole {
    animation: pop 0.2s ease-out;
}

@keyframes pop {
    from {
        transform: translateY(20px) scale(0.5);
    }
    to {
        transform: translateY(0) scale(1);
    }
}

button.start {
    background: #ff79ae;
    color: white;
    border: none;
    padding: 14px 30px;
    border-radius: 30px;
    font-size: 18px;
    cursor: pointer;
    margin-top: 20px;
    font-weight: bold;
}

button.start:hover {
    background: #e85d9e;
}

#message {
    font-size: 20px;
    font-weight: bold;
    margin-top: 15px;
    min-height: 25px;
}

@media(max-width: 380px) {
    .hole {
        height: 80px;
        font-size: 38px;
    }
    h1 {
        font-size: 28px;
    }
}
</style>
</head>

<body>

<h1>🐹 Whack-a-Mole! 🌸</h1>
<p class="subtitle">
    Catch the cute little moles!
</p>

<div class="game">

    <div class="stats">
        <div class="stat">
            Score
            <span id="score">0</span>
        </div>

        <div class="stat">
            Time
            <span id="time">30</span>
        </div>

        <div class="stat">
            Best
            <span id="best">0</span>
        </div>
    </div>

    <div class="board" id="board">

        <button class="hole" data-index="0">🕳️</button>
        <button class="hole" data-index="1">🕳️</button>
        <button class="hole" data-index="2">🕳️</button>
        <button class="hole" data-index="3">🕳️</button>
        <button class="hole" data-index="4">🕳️</button>
        <button class="hole" data-index="5">🕳️</button>
        <button class="hole" data-index="6">🕳️</button>
        <button class="hole" data-index="7">🕳️</button>
        <button class="hole" data-index="8">🕳️</button>

    </div>

    <p id="message">
        Ready to play? 💖
    </p>

    <button class="start" id="startBtn"
        onclick="startGame()">
        Start Game 🎮
    </button>

</div>

<script>

let score = 0;
let time = 30;
let best = Number(localStorage.getItem("moleBest")) || 0;

let playing = false;
let activeMole = -1;

let timerInterval;
let moleInterval;
let moleTimeout;

const holes = document.querySelectorAll(".hole");

const scoreDisplay = document.getElementById("score");
const timeDisplay = document.getElementById("time");
const bestDisplay = document.getElementById("best");
const message = document.getElementById("message");
const startBtn = document.getElementById("startBtn");

bestDisplay.textContent = best;

// Show a mole
function showMole() {

    if (!playing) return;

    holes.forEach(hole => {
        hole.textContent = "🕳️";
        hole.classList.remove("mole");
    });

    activeMole = Math.floor(Math.random() * holes.length);

    holes[activeMole].textContent = "🐹";
    holes[activeMole].classList.add("mole");

    // Mole disappears automatically
    clearTimeout(moleTimeout);

    moleTimeout = setTimeout(() => {
        if (playing && activeMole !== -1) {
            holes[activeMole].textContent = "🕳️";
            holes[activeMole].classList.remove("mole");
            activeMole = -1;
        }
    }, Math.max(500, 1200 - score * 15));

}

// Start the game
function startGame() {

    clearInterval(timerInterval);
    clearInterval(moleInterval);
    clearTimeout(moleTimeout);

    score = 0;
    time = 30;
    playing = true;
    activeMole = -1;

    scoreDisplay.textContent = score;
    timeDisplay.textContent = time;

    message.textContent = "Catch the moles! 🐹";
    startBtn.textContent = "Restart Game 🔄";

    holes.forEach(hole => {
        hole.textContent = "🕳️";
        hole.classList.remove("mole");
    });

    showMole();

    // Change mole position
    function scheduleMole() {
        if (!playing) return;

        showMole();

        const speed = Math.max(550, 1200 - score * 15);

        moleInterval = setTimeout(scheduleMole, speed);
    }

    clearTimeout(moleInterval);
    moleInterval = setTimeout(scheduleMole, 1200);

    // Countdown
    timerInterval = setInterval(() => {

        time--;

        timeDisplay.textContent = time;

        if (time <= 0) {
            endGame();
        }

    }, 1000);

}

// Hit the mole
function hitMole(index) {

    if (!playing) return;

    if (index === activeMole) {

        score++;

        scoreDisplay.textContent = score;

        holes[index].textContent = "⭐";
        holes[index].classList.remove("mole");

        activeMole = -1;

        if (score > best) {
            best = score;
            bestDisplay.textContent = best;

            localStorage.setItem("moleBest", best);
        }

        message.textContent = "Great job! ⭐";

        clearTimeout(moleTimeout);
    }

}

// Add click events
holes.forEach((hole, index) => {

    hole.addEventListener("click", () => {
        hitMole(index);
    });

});

// End game
function endGame() {

    playing = false;

    clearInterval(timerInterval);
    clearTimeout(moleInterval);
    clearTimeout(moleTimeout);

    activeMole = -1;

    holes.forEach(hole => {
        hole.textContent = "🕳️";
        hole.classList.remove("mole");
    });

    message.textContent =
        "🎉 Game Over! Your score: " + score;

    startBtn.textContent = "Play Again 💖";

}

</script>

</body>
</html>
